[workspace]
members = [
  "crates/intent-core",
  "crates/intent-engine",
  "crates/intent-runtime",
  "crates/intent-store",
  "crates/intent-feltdb",
  "crates/intent-wasm",
  "crates/intent-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
