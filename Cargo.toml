[workspace]
members = [
  "crates/feltdb-contract",
  "crates/feltdb-inference",
  "crates/feltdb-runtime",
  "crates/feltdb-store",
  "crates/feltdb-adapter",
  "crates/feltdb-contract-wasm",
  "crates/feltdb-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
